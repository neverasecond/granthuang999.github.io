<script>
(function(){
    document.addEventListener('click', function(event) {
        const link = event.target instanceof Element ? event.target.closest('a') : null;
        if (!link) return;

        if (link.matches('.share-button')) {
            window.trackSiteEvent('article_share', {
                method: (link.id || link.textContent || 'unknown').replace(/^share-/, '').trim(),
                page_location: window.location.href
            });
        }

        if (link.matches('.related-posts a, .post-nav a')) {
            window.trackSiteEvent('related_article_click', {
                link_url: link.href,
                link_text: (link.textContent || '').trim().slice(0, 120)
            });
        }

        try {
            const destination = new URL(link.href, window.location.href);
            if (destination.hostname === 'x.com' || destination.hostname === 'www.x.com' || destination.hostname === 'twitter.com') {
                window.trackSiteEvent('outbound_x_click', {
                    link_url: destination.href,
                    link_text: (link.textContent || '').trim().slice(0, 120)
                });
            }
        } catch (_) {
            // Ignore non-HTTP links such as mailto and javascript URLs.
        }
    });

    const postBody = document.getElementById('postBody');
    if (!postBody) return;
    const sent = new Set();
    function recordReadingProgress() {
        const documentHeight = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
        const percent = Math.min(100, Math.round((window.scrollY / documentHeight) * 100));
        [50, 90].forEach(function(threshold) {
            if (percent >= threshold && !sent.has(threshold)) {
                sent.add(threshold);
                window.trackSiteEvent('scroll_' + threshold, {
                    percent_scrolled: threshold,
                    page_location: window.location.href
                });
            }
        });
        if (sent.size === 2) window.removeEventListener('scroll', recordReadingProgress);
    }
    window.addEventListener('scroll', recordReadingProgress, {passive: true});
    recordReadingProgress();
})();
</script>

<script>
window.addEventListener('load', function() {
    function fitHeading() {
        const h1Element = document.querySelector('.header-main-content h1');
        if (!h1Element) return;

        const textElement = h1Element.querySelector('a') || h1Element;
        const parentContainer = h1Element.closest('.header-main-content');
        
        // [关键修正] 提前进行严格的安全检查，防止任何一个元素不存在时脚本报错
        if (!parentContainer || !textElement) return;
        const rightButtons = parentContainer.querySelector('.title-right');
        if (!rightButtons) return;

        // 在确保所有元素都存在后，再进行计算
        const availableWidth = parentContainer.clientWidth - rightButtons.clientWidth - 20;
        const maxFontSize = window.innerWidth <= 600 ? 20 : 30;
        const minFontSize = 12;

        let currentFontSize = maxFontSize;
        textElement.style.setProperty('font-size', currentFontSize + 'px', 'important');

        // 添加一个安全检查，防止无限循环
        let attempts = 0;
        while (textElement.scrollWidth > availableWidth && currentFontSize > minFontSize && attempts < 100) {
            currentFontSize--;
            textElement.style.setProperty('font-size', currentFontSize + 'px', 'important');
            attempts++;
        }
    }

    function debounce(func, delay) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), delay);
        };
    }
    
    fitHeading();
    window.addEventListener('resize', debounce(fitHeading, 100));
});
</script>
