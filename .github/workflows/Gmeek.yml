name: Build and Deploy Gmeek Site (Full Build)

on:
  push:
    branches:
      - main
    # Article images are staged before an Issue is published. They are copied
    # and deployed by the later label-triggered incremental build.
    paths-ignore:
      - "static/images/**"
      - "docs/**"
      - "backup/**"
      - "blogBase.json"
      - "README.md"
      - ".github/url-submission-history/**"
  workflow_dispatch:
  schedule:
    - cron: "16 4 * * *"

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: gmeek-full-build
      cancel-in-progress: false
    if: |
      github.actor != 'github-actions[bot]' &&
      github.repository == 'neverasecond/granthuang999.github.io'
    permissions:
      contents: write
      # ▼▼▼ 修复点 1：增加 issues 写入权限解决 403 错误 ▼▼▼
      issues: write
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new html (Full Build)
        run: |
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Index site with Pagefind
        run: |
          npm config set registry https://registry.npmmirror.com/
          npx -y pagefind --site docs
      
      - name: Commit and Push build files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff --quiet --cached; then
            git commit -m "🎉 chore(full): auto build and update site content"
            git fetch origin main
            git rebase origin/main
            git push origin main
          else
            echo "No changes to site content to commit."
          fi

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "docs/"
          REMOTE_HOST: ${{ secrets.VPS_IP }}
          REMOTE_USER: "root"
          TARGET: "/var/www/futuremedia/"
          EXCLUDE: "/dist/, /node_modules/"
