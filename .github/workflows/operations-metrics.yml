name: Daily Operations Metrics

on:
  push:
    paths:
      - operations/account_overview_analytics.csv
  workflow_dispatch:
    inputs:
      report_mode:
        description: Report mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - weekly
          - monthly
      dry_run:
        description: Collect and validate without storing or emailing
        required: true
        default: false
        type: boolean
  schedule:
    # Cloud schedules use UTC. 00:15 UTC = 08:15 China Standard Time.
    - cron: "15 0 * * *"

concurrency:
  group: daily-operations-metrics
  cancel-in-progress: false

jobs:
  collect:
    name: Collect private operating metrics
    runs-on: ubuntu-latest
    if: github.repository == 'neverasecond/granthuang999.github.io'
    permissions:
      contents: read
    env:
      SITE_URL: https://www.790427.xyz
      GA4_PROPERTY_ID: "369092012"
      SEARCH_CONSOLE_SITE: https://www.790427.xyz/
      OPS_ENDPOINT: https://www.790427.xyz/api/ops
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON }}
      CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
      NEWSLETTER_SEND_TOKEN: ${{ secrets.NEWSLETTER_SEND_TOKEN }}
      X_ANALYTICS_CSV_PATH: operations/account_overview_analytics.csv
      X_TIME_SPLIT: ${{ vars.X_TIME_SPLIT || '0,0' }}
      REPORT_MODE: ${{ github.event.inputs.report_mode || 'auto' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in GOOGLE_SEARCH_CONSOLE_CREDENTIALS_JSON CLARITY_API_TOKEN NEWSLETTER_SEND_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Required secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Import X analytics CSV if present
        run: |
          set -euo pipefail
          if [ ! -f "${X_ANALYTICS_CSV_PATH}" ]; then
            echo "X analytics CSV not found: ${X_ANALYTICS_CSV_PATH}; skipping."
            exit 0
          fi
          args=(--csv-path "${X_ANALYTICS_CSV_PATH}" --time-split "${X_TIME_SPLIT}")
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python operations/import_x_csv.py "${args[@]}"

      - name: Collect metrics and send due reports
        run: |
          set -euo pipefail
          args=(--report-mode "${REPORT_MODE}")
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python operations/collect_metrics.py "${args[@]}"
