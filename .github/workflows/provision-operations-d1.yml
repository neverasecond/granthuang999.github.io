name: Provision Operations D1 (Temporary)

on:
  push:
    branches:
      - codex/daily-operations-metrics
    paths:
      - ".github/workflows/provision-operations-d1.yml"

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create or find private operations database
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/d1/database"
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          def call(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          databases = call(base).get("result", [])
          existing = next((item for item in databases if item.get("name") == "daily_operations_metrics"), None)
          if existing:
              database = existing
          else:
              database = call(base, "POST", {"name": "daily_operations_metrics"})["result"]
          print(f"OPS_D1_DATABASE_ID={database['uuid']}")
          print(f"OPS_D1_DATABASE_NAME={database['name']}")
          PY
