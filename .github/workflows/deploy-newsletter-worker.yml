name: Deploy Newsletter Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/newsletter/**"
      - "operations/**"
      - ".github/workflows/deploy-newsletter-worker.yml"

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    if: github.repository == 'neverasecond/granthuang999.github.io'
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_REPORT_EMAIL: ${{ secrets.OPS_REPORT_EMAIL }}
    defaults:
      run:
        working-directory: workers/newsletter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Apply operations database schema
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler d1 execute daily_operations_metrics --remote --file=../../operations/schema.sql

      - name: Deploy newsletter worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy

      - name: Configure private operations report recipient
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.OPS_REPORT_EMAIL != ''
        run: printf '%s' "$OPS_REPORT_EMAIL" | npx wrangler secret put OPS_REPORT_EMAIL

      - name: Explain skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured; Worker deploy skipped."
