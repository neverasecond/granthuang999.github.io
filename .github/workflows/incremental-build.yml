name: Incremental Build (Issues)

on:
  issues:
    # New Issues start without labels and are drafts. Publishing begins when
    # the first label is added; later edits to a published Issue rebuild it.
    types: [edited, labeled]

jobs:
  build-incremental:
    name: Incremental Build and Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: gmeek-site-build
      cancel-in-progress: false
    if: |
      github.actor != 'github-actions[bot]' &&
      github.repository == 'neverasecond/granthuang999.github.io' &&
      join(github.event.issue.labels.*.name, '') != ''
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine Issue Number
        id: determine_issue
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.determine_issue.outputs.issue_number != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        if: steps.determine_issue.outputs.issue_number != ''
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate new html (Incremental)
        if: steps.determine_issue.outputs.issue_number != ''
        run: |
          python Gmeek.py ${{ secrets.GITHUB_TOKEN }} ${{ github.repository }} --issue_number '${{ steps.determine_issue.outputs.issue_number }}'

      - name: Setup Node.js & Index with Pagefind
        if: steps.determine_issue.outputs.issue_number != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - run: |
          npm config set registry https://registry.npmmirror.com/
          npx -y pagefind --site docs
        if: steps.determine_issue.outputs.issue_number != ''

      - name: Commit and Push build files
        if: steps.determine_issue.outputs.issue_number != ''
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # ▼▼▼ 核心修复：改成 git add . (添加所有变动文件，包括 README) ▼▼▼
          git add .
          if ! git diff --quiet --cached; then
            git commit -m "🚀 chore(incremental): auto build for issue #${{ steps.determine_issue.outputs.issue_number }}"
            git pull --rebase
            git push
          else
            echo "No changes to site content to commit."
          fi

      - name: Deploy to VPS
        if: steps.determine_issue.outputs.issue_number != ''
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-avzr --delete"
          SOURCE: "docs/"
          REMOTE_HOST: ${{ secrets.VPS_IP }}
          REMOTE_USER: "root"
          TARGET: "/var/www/futuremedia/"
          EXCLUDE: "/dist/, /node_modules/"
