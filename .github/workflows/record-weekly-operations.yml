name: Record Weekly Operations

on:
  workflow_dispatch:
    inputs:
      week_ending:
        description: Week ending date (YYYY-MM-DD)
        required: true
        type: string
      csv_path:
        description: Optional repository CSV path, for example operations/private/x-weekly.csv
        required: false
        type: string
      csv_data:
        description: Optional raw X analytics CSV content. CLI can use gh workflow run ... -F csv_data=@file.csv
        required: false
        type: string
      time_split:
        description: Creation and interaction hours, for example 20,20
        required: true
        default: "20,20"
        type: string
      dry_run:
        description: Parse and validate without storing
        required: true
        default: false
        type: boolean

jobs:
  record:
    runs-on: ubuntu-latest
    if: github.repository == 'neverasecond/granthuang999.github.io'
    env:
      OPS_ENDPOINT: https://www.790427.xyz/api/ops/weekly-input
      NEWSLETTER_SEND_TOKEN: ${{ secrets.NEWSLETTER_SEND_TOKEN }}
      WEEK_ENDING: ${{ inputs.week_ending }}
      CSV_PATH: ${{ inputs.csv_path }}
      CSV_DATA: ${{ inputs.csv_data }}
      TIME_SPLIT: ${{ inputs.time_split }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Import X analytics CSV
        run: |
          set -euo pipefail
          args=(--week-ending "${WEEK_ENDING}" --time-split "${TIME_SPLIT}")
          if [ -n "${CSV_PATH:-}" ]; then
            args+=(--csv-path "${CSV_PATH}")
          elif [ -n "${CSV_DATA:-}" ]; then
            args+=(--csv-data "${CSV_DATA}")
          else
            echo "Provide csv_data or csv_path." >&2
            exit 1
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          python operations/import_x_csv.py "${args[@]}"
